[project]
name = "docmind-ai"
version = "1.0.0"
description = "DocMind AI — a LangChain + LangGraph document RAG assistant with a Streamlit UI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5.1",
    "httpx>=0.28.0",
    "langchain>=1.2.0",
    "langgraph>=1.0.4",
    "numpy==1.26.4",
    "onnxruntime==1.17.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pypdf>=6.4.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "sentence-transformers==2.6.1",
    "streamlit>=1.41.0",
    "transformers>=4.41.0,<4.50.0",
    "sqlalchemy>=2.0.45",
    "torch==2.2.2",
    "xlrd>=2.0.2",
    "langchain-openai>=1.4.1",
    "langchain-anthropic>=1.5.2",
    "langchain-google-genai>=4.3.1",
    "langchain-core>=1.5.1",
    "langchain-community>=0.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "docx2txt>=0.9",
    "unstructured>=0.15",
    "markdown>=3.10.2",
    "networkx>=3.6.1",
    "msoffcrypto-tool>=6.0.0",
]
